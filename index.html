<!-- created by ai -->
<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
<title>Kartenmacher – eigene Spielkarten erstellen</title>
<link rel="stylesheet" href="vendor/cropperjs/cropper.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <span class="material-symbols-outlined topbar-icon">auto_awesome</span>
    <h1>Kartenmacher</h1>
  </header>

  <main class="layout">

    <section class="form-pane">

      <div class="form-card">
        <h2><span class="material-symbols-outlined">badge</span>Name</h2>
        <input id="nameInput" class="text-input" type="text" maxlength="28" placeholder="Wie heißt deine Figur?">
      </div>

      <div class="form-card">
        <h2><span class="material-symbols-outlined">image</span>Bild</h2>
        <div class="image-buttons">
          <button id="cameraBtn" class="btn btn-secondary" type="button">
            <span class="material-symbols-outlined">photo_camera</span>Foto machen
          </button>
          <button id="uploadBtn" class="btn btn-secondary" type="button">
            <span class="material-symbols-outlined">upload</span>Bild wählen
          </button>
        </div>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
        <input type="file" id="uploadInput" accept="image/*" hidden>
      </div>

      <div class="form-card">
        <h2><span class="material-symbols-outlined">list</span>Eigenschaften</h2>
        <div id="statsList" class="stats-list"></div>
        <button id="addStatBtn" class="btn btn-text" type="button">
          <span class="material-symbols-outlined">add</span>Eigenschaft hinzufügen
        </button>
      </div>

      <div class="form-card">
        <h2><span class="material-symbols-outlined">star</span>Seltenheitswert</h2>
        <div class="star-picker" id="starPicker"></div>
      </div>

      <div class="form-card">
        <h2><span class="material-symbols-outlined">palette</span>Hintergrund</h2>
        <div class="gradient-presets" id="gradientPresets"></div>
        <div class="color-inputs">
          <label>Farbe 1<input type="color" id="color1"></label>
          <label>Farbe 2<input type="color" id="color2"></label>
        </div>
      </div>

      <div class="form-card">
        <h2><span class="material-symbols-outlined">flip</span>Rückseite</h2>
        <div class="back-presets" id="backPresets">
          <button type="button" class="back-option selected" data-back="none">
            <span class="back-thumb back-thumb-none"><span class="material-symbols-outlined">block</span></span>
            <span class="back-option-label">Keine</span>
          </button>
          <button type="button" class="back-option" data-back="normal">
            <span class="back-thumb" style="background-image:url('assets/back-normal.jpeg')"></span>
            <span class="back-option-label">Normal</span>
          </button>
          <button type="button" class="back-option" data-back="gold">
            <span class="back-thumb" style="background-image:url('assets/back-gold.jpeg')"></span>
            <span class="back-option-label">Golden</span>
          </button>
        </div>
      </div>

    </section>

    <section class="preview-pane">
      <div class="card-preview" id="cardPreview">
        <div class="card-inner" id="cardInner">
          <div class="card-name" id="previewName">Name</div>
          <div class="card-image-frame" id="previewImageFrame">
            <img id="previewImage" alt="" hidden>
            <span class="material-symbols-outlined placeholder-icon" id="previewPlaceholder">image</span>
          </div>
          <div class="card-stats" id="previewStats"></div>
          <div class="card-stars-row">
            <span class="card-stars-label">Seltenheit</span>
            <div class="card-stars" id="previewStars"></div>
          </div>
        </div>
      </div>
      <button id="exportBtn" class="btn btn-primary btn-large" type="button" disabled>
        <span class="material-symbols-outlined">download</span>Karte speichern
      </button>
      <p class="hint" id="exportHint">Gib zuerst einen Namen ein.</p>
    </section>

  </main>

  <div class="photo-crop-overlay" id="cropperModal" hidden>
    <div class="cropper-topbar">
      <button id="cropCancelBtn" class="btn btn-icon" type="button" aria-label="Abbrechen">
        <span class="material-symbols-outlined">close</span>
      </button>
      <span>Bild zuschneiden</span>
      <button id="cropConfirmBtn" class="btn btn-icon btn-icon-primary" type="button" aria-label="Fertig">
        <span class="material-symbols-outlined">check</span>
      </button>
    </div>
    <div class="cropper-container">
      <img id="cropperImage" alt="">
    </div>
    <div class="cropper-controls">
      <span class="material-symbols-outlined">image</span>
      <input type="range" id="zoomRange" min="0" max="100" value="0">
      <span class="material-symbols-outlined zoom-icon-large">image</span>
    </div>
  </div>

</div>

<script src="vendor/cropperjs/cropper.min.js"></script>
<script src="assets/card-backs-data.js"></script>
<script src="app.js"></script>
</body>
</html>
